name: Keep Render shop awake

on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分钟 ping 一次
  workflow_dispatch:        # 也支持手动触发

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping buchu-shop on Render
        run: |
          for i in 1 2 3; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 https://buchu-shop.onrender.com/)
            echo "attempt $i: HTTP $code"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          exit 1
