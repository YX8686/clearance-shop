name: Keep Render shop awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake home and all product pages
        run: |
          python3 - <<'PY'
          import urllib.request, re
          BASE = "https://buchu-shop.onrender.com"
          def get(url):
              return urllib.request.urlopen(url, timeout=30).read().decode('utf-8', 'ignore')
          try:
              html = get(BASE + "/")
          except Exception as e:
              print("home fetch ERR", e)
              raise SystemExit(1)
          ids = re.findall(r'"id"\s*:\s*"([\w-]+)"', html)
          ids = list(dict.fromkeys(ids))
          print("found", len(ids), "product ids")
          for i in ids:
              try:
                  code = urllib.request.urlopen(BASE + "/product/" + i, timeout=30).status
                  print("product/" + i + " -> " + str(code))
              except Exception as e:
                  print("product/" + i + " ERR " + str(e))
          print("home -> " + str(urllib.request.urlopen(BASE + "/", timeout=30).status))
          PY
# touch 20260911-221916 to re-register schedule
