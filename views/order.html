<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>我的订单</title>
<link rel="icon" href="/assets/logo.ico">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f3ee;color:#3a322b}
  .wrap{max-width:520px;margin:0 auto;padding-bottom:30px}
  .head{background:linear-gradient(135deg,#b8743f,#c98a6b);color:#fff;padding:18px 16px}
  .head h1{margin:0;font-size:18px}
  .head .id{font-size:12px;opacity:.9;margin-top:6px;letter-spacing:1px}
  .box{background:#fff;margin:12px 14px;border-radius:14px;padding:14px 16px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
  .status{display:inline-block;padding:5px 14px;border-radius:20px;font-size:13px;font-weight:600}
  .s-wait{background:#fff3e0;color:#e08a00}
  .s-confirm{background:#f3e8ff;color:#7c3aed}
  .s-ship{background:#e8f1ff;color:#2f6fd0}
  .s-done{background:#e6f7ec;color:#1f9d55}
  .s-cancel{background:#d4c8b8;color:#5b3a1f}
  .donebtn{width:100%;background:#b8743f;color:#fff;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:700;margin-top:14px;cursor:pointer}
  .row{padding:9px 0;border-bottom:1px solid #f3efe8;font-size:14px}
  .row:last-child{border-bottom:none}
  .row .k{font-size:12px;color:#9a8f82;margin-bottom:3px}
  .row .v{font-weight:600;word-break:break-all}
  .items .it{display:flex;justify-content:space-between;padding:8px 0;font-size:14px;border-bottom:1px solid #f3efe8}
  .items .it:last-child{border-bottom:none}
  .items .it .q{color:#9a8f82;white-space:nowrap;margin-left:8px}
  .total{text-align:right;font-size:15px;font-weight:700;color:#c0392b;margin-top:8px;padding-top:8px;border-top:1px dashed #e0d6c8}
  .pay{text-align:center;padding:6px 0}
  .pay-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
  .pay-tabs button{border:1px solid #d8ccba;background:#fff;border-radius:18px;padding:7px 14px;font-size:13px;color:#7a6f62;cursor:pointer;min-width:90px}
  .pay-tabs button.on{background:#b8743f;color:#fff;border-color:#b8743f;font-weight:700}
  .pay img{width:200px;height:200px;object-fit:contain;background:#fff;border:1px solid #eee;border-radius:10px}
  .pay .bank-card-img{flex:1;min-width:130px;max-width:220px;height:auto;display:block;border-radius:10px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
  .pay .placeholder{width:200px;height:200px;display:flex;align-items:center;justify-content:center;background:#faf7f2;border:1px dashed #d8ccba;border-radius:10px;color:#9a8f82;font-size:13px;margin:0 auto}
  .pay .tip{font-size:13px;color:#7a5230;line-height:1.7;margin-top:12px;background:#fff7ef;padding:12px;border-radius:10px}
  .pay .tip b{color:#c0392b}
  .bank-info{background:#faf7f2;border-radius:10px;padding:14px;font-size:14px;line-height:1.8;text-align:left}
  .bank-info .line{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e0d6c8}
  .bank-info .line:last-child{border-bottom:none}
  .bank-info button{margin-top:10px;width:100%;background:#e6f7ec;color:#1f9d55;border:none;border-radius:18px;padding:9px;font-size:13px;cursor:pointer}
  .savebar{display:flex;gap:10px;margin:14px}
  .savebar button{flex:1;border:none;background:#fff;border-radius:24px;padding:11px;font-size:13px;color:#7a5230;box-shadow:0 2px 8px rgba(0,0,0,.05);cursor:pointer}
  .savebar button.primary{background:#b8743f;color:#fff}
  .gone{text-align:center;padding:60px 20px;color:#bbb}
  /* 查询其他订单结果卡片 */
  .oCard{background:#fff;border-radius:12px;padding:14px;margin-bottom:12px;cursor:pointer;box-shadow:0 1px 6px rgba(0,0,0,.05);border:1px solid #f0ece4}
  .oCard .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .oCard .id{font-weight:700;color:#b8743f;font-size:15px;letter-spacing:.5px}
  .oCard .status{display:inline-block;font-size:12px;padding:4px 10px;border-radius:12px;font-weight:600}
  .oCard .st-wait{background:#fff3e0;color:#e08a00}
  .oCard .st-confirm{background:#f3e8ff;color:#7c3aed}
  .oCard .st-ship{background:#e8f1ff;color:#2f6fd0}
  .oCard .st-done{background:#e6f7ec;color:#1f9d55}
  .oCard .st-cancel{background:#d4c8b8;color:#7a6f55}
  .oCard .sect{margin-bottom:10px}
  .oCard .sect:last-child{margin-bottom:0}
  .oCard .sect-title{font-size:12px;color:#9a8f82;margin-bottom:6px;font-weight:600}
  .oCard .info-line{font-size:13px;color:#3a322b;line-height:1.8;padding:3px 0;border-bottom:1px dashed #f0ece4}
  .oCard .info-line:last-child{border-bottom:none}
  .oCard .info-line .lbl{color:#9a8f82;display:inline-block;width:52px}
  .oCard .item-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px dashed #f0ece4}
  .oCard .item-line:last-child{border-bottom:none}
  .oCard .item-name{color:#3a322b;flex:1;padding-right:10px}
  .oCard .item-price{color:#9a8f82;white-space:nowrap}
  .oCard .total{text-align:right;font-size:15px;font-weight:700;color:#c0392b;margin-top:8px;padding-top:8px;border-top:1px solid #f0ece4}
  .oCard .tracking{margin-top:10px;background:#f6f3ee;border-radius:8px;padding:10px}
  .oCard .tracking .tt{font-size:12px;color:#9a8f82;margin-bottom:2px}
  .oCard .tracking .no{font-size:15px;font-weight:700;color:#1f9d55;letter-spacing:.5px}
  .remodal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.7);padding:20px}
  .remodal-back{position:absolute;inset:0}
  .remodal-box{position:relative;z-index:1;width:min(90vw,420px);text-align:center}
  .remodal-box img{width:100%;border-radius:14px;background:#fbf7f1;box-shadow:0 12px 36px rgba(0,0,0,.25);display:block}
  .remodal-tip{font-size:14px;color:#fff;margin:14px 0 10px;line-height:1.5}
  .remodal-close{border:none;background:#fff;color:#3a322b;border-radius:24px;padding:11px 28px;font-size:14px;font-weight:700;cursor:pointer}
  .qr-wrap{display:inline-block;position:relative}
  .qr-wrap img{cursor:pointer}
  .qr-lightbox{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.85);padding:20px;flex-direction:column}
  .qr-lightbox.show{display:flex}
  .qr-lightbox img{max-width:100%;max-height:70vh;border-radius:14px;background:#fff;display:block}
  .qr-lightbox .tip{color:#fff;font-size:14px;margin:14px 0 10px;text-align:center;line-height:1.5}
  .qr-lightbox .actions{display:flex;gap:12px}
  .qr-lightbox button{border:none;background:#fff;color:#3a322b;border-radius:24px;padding:10px 22px;font-size:14px;font-weight:600;cursor:pointer}
  .qr-lightbox button.primary{background:#b8743f;color:#fff}
  /* 付款步骤面板：标题居中，步骤左对齐、整行排开、步骤间空行 */
  .qr-steps{width:min(92vw,400px);background:#fff;border-radius:16px;padding:24px 20px 18px;text-align:center;max-height:82vh;overflow-y:auto;box-shadow:0 12px 36px rgba(0,0,0,.25)}
  .qr-steps-title{font-size:17px;font-weight:700;color:#3a322b;text-align:center;margin-bottom:18px}
  .qr-step{display:flex;align-items:flex-start;text-align:left;gap:10px;margin-bottom:16px;line-height:1.65}
  .qr-step:last-of-type{margin-bottom:14px}
  .qr-step .n{flex:none;width:22px;height:22px;line-height:22px;border-radius:50%;background:#b8743f;color:#fff;font-size:12px;font-weight:700;text-align:center;margin-top:3px}
  .qr-step .t{font-size:14px;color:#3a322b;flex:1}
  .qr-back{border:none;background:#f6f3ee;color:#7a5230;border-radius:20px;padding:9px 30px;font-size:13px;font-weight:600;cursor:pointer;margin-top:2px}
</style>
</head>
<body>
  <div id="app"></div>
  <div class="qr-lightbox" id="qrLightbox" onclick="if(event.target===this)closeQrLightbox()">
    <div id="qrBody" style="display:flex;flex-direction:column;align-items:center">
      <img id="qrLightboxImg" src="" alt="收款码">
      <div class="tip" id="qrLightboxTip">点击「保存图片」查看付款步骤，或长按上图保存到相册</div>
      <div class="actions">
        <button class="primary" onclick="saveQrImage()">保存图片</button>
        <button onclick="closeQrLightbox()">关闭</button>
      </div>
    </div>
    <div id="qrSteps" class="qr-steps" style="display:none">
      <div class="qr-steps-title">操作步骤</div>
      <div class="qr-step"><span class="n">1</span><div class="t">长按上方二维码图片</div></div>
      <div class="qr-step"><span class="n">2</span><div class="t">在弹出的菜单里选择「保存到手机」</div></div>
      <div class="qr-step"><span class="n">3</span><div class="t">退出本商城，回到微信主界面，点开右上角「+」号，选择「扫一扫」</div></div>
      <div class="qr-step"><span class="n">4</span><div class="t">从相册中选中刚才保存的二维码，扫描后即可向我付款</div></div>
      <div class="qr-step"><span class="n">5</span><div class="t">付款成功后截图，发给夏天老师本人，再重新点击商城链接回来继续操作</div></div>
      <button class="qr-back" onclick="backFromSteps()">返回</button>
    </div>
  </div>
<script>
const O = {{ORDER_JSON}};
const CONFIG = {{CONFIG_JSON}};
function money(n){ return '¥'+Number(n).toLocaleString('zh-CN'); }
const app=document.getElementById('app');
function isWechat(){ return typeof navigator!=='undefined' && /MicroMessenger/i.test(navigator.userAgent); }
function openQrLightbox(src, title){
  if(!src) return;
  document.getElementById('qrLightboxImg').src=src;
  document.getElementById('qrLightboxTip').textContent=(title||'收款码')+'：长按二维码识别或保存到相册';
  document.getElementById('qrLightbox').classList.add('show');
}
function closeQrLightbox(){ document.getElementById('qrLightbox').classList.remove('show'); }
function saveQrImage(){
  const img=document.getElementById('qrLightboxImg');
  if(!img||!img.src) return;
  if(isWechat()){
    // 微信内无法直接保存，展示排版清晰的操作步骤（标题居中、步骤左对齐、每步空行）
    document.getElementById('qrBody').style.display='none';
    document.getElementById('qrSteps').style.display='block';
    return;
  }
  // 普通浏览器尝试下载，失败时给出提示
  const a=document.createElement('a'); a.href=img.src; a.download=(img.alt||'收款码')+'.jpg'; a.target='_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function backFromSteps(){
  document.getElementById('qrSteps').style.display='none';
  document.getElementById('qrBody').style.display='flex';
}

function copyText(text, msg){
  if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(()=>{ if(msg) alert(msg); }).catch(()=>fallbackCopy(text,msg));
  } else { fallbackCopy(text,msg); }
}
function fallbackCopy(text, msg){
  const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta);
  if(msg) alert(msg);
}
function detectCourier(no){
  const s=String(no).toUpperCase().replace(/\s/g,'');
  if(/^SF/.test(s)) return {name:'顺丰速运', url:'https://www.sf-express.com/chn/sc/dynamic_function/waybill/#search/bill-number/'+no};
  if(/^YT/.test(s)) return {name:'圆通速递', url:'https://www.yto.net.cn/waybillQuery?waybillNo='+no};
  if(/^ZTO/.test(s) || /^(75|77|78)\d{12}$/.test(s)) return {name:'中通快递', url:'https://www.zto.com/cn/search?billNo='+no};
  if(/^STO/.test(s) || /^77\d{12}$/.test(s)) return {name:'申通快递', url:'https://www.sto.cn/Home/BillSelect?billcode='+no};
  if(/^YD/.test(s)) return {name:'韵达速递', url:'https://www.yundaex.com/cn/personal/waybill.php?wen='+no};
  if(/^EMS/.test(s) || /^E[A-Z]\d{9}CN$/.test(s)) return {name:'EMS', url:'https://www.ems.com.cn/queryList?mailNum='+no};
  if(/^JD/.test(s)) return {name:'京东物流', url:'https://www.jdl.com/oder/search?waybillCodes='+no};
  return {name:'快递查询', url:'https://m.kuaidi100.com/result.jsp?nu='+encodeURIComponent(no)};
}
function queryTracking(no){
  copyText(no, '快递单号已复制：'+no);
  const c=detectCourier(no);
  setTimeout(()=>{ window.open(c.url, '_blank'); }, 200);
}

function savePage(){
  if(typeof navigator!=='undefined' && navigator.share){
    navigator.share({title:document.title, url:location.href}).catch(()=>{});
  } else {
    alert('请按以下方式收藏本页：\n• 微信内：点击右上角「⋮」→「收藏」\n• 浏览器：按 Ctrl+D（或 Cmd+D）加入书签');
  }
}
function buildOrderCard(o){
  const stClass = {'待付款':'st-wait','待确认':'st-confirm','待发货':'st-ship','已发货':'st-done','已取消':'st-cancel'}[o.status] || 'st-wait';
  const stLabel = o.status==='已发货' ? '发货中' : o.status;
  const itemsHtml = o.items.map(i=>{
    let h=`<div class="item-line"><span class="item-name">${i.name}</span><span class="item-price">${money(i.price)} × ${i.qty}</span></div>`;
    if(i.bundleItems && i.bundleItems.length){
      h+=`<div style="background:#fbf7f1;border-radius:8px;padding:8px 10px;margin:2px 0 8px;font-size:12px;color:#7a5230;line-height:1.7">
        <div style="font-weight:700;margin-bottom:2px">📦 发货内容</div>
        ${i.bundleItems.map(b=>`<div style="display:flex;justify-content:space-between"><span>• ${b.name}</span><span style="white-space:nowrap;margin-left:8px">${b.qty} ${b.unit||'件'}${i.qty>1?' ×'+i.qty:''}</span></div>`).join('')}
      </div>`;
    }
    return h;
  }).join('');
  let trackingHtml = '';
  if(o.status==='已发货' && o.tracking){
    const c=detectCourier(o.tracking);
    trackingHtml = `<div class="tracking">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px"><div class="tt">${c.name}</div><div style="display:flex;gap:6px"><button onclick="event.stopPropagation();copyText('${o.tracking}','单号已复制')" style="border:none;background:#fff;color:#1f9d55;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer">复制</button><button onclick="event.stopPropagation();queryTracking('${o.tracking}')" style="border:none;background:#1f9d55;color:#fff;border-radius:12px;padding:3px 10px;font-size:11px;font-weight:600;cursor:pointer">查物流</button></div></div>
      <div class="no">${o.tracking}</div>
    </div>`;
  }
  const div=document.createElement('div'); div.className='oCard';
  div.onclick=()=>location.href='/order/'+o.id;
  div.innerHTML=`<div class="head"><span class="id">订单号：${o.id}</span><span class="status ${stClass}">${stLabel}</span></div>
    <div class="sect">
      <div class="sect-title">收货信息</div>
      <div class="info-line"><span class="lbl">姓名</span>${o.name}</div>
      <div class="info-line"><span class="lbl">电话</span>${o.phone}</div>
      <div class="info-line"><span class="lbl">地址</span>${o.address}</div>
      ${o.wechat ? `<div class="info-line"><span class="lbl">微信</span>${o.wechat}</div>` : ''}
    </div>
    <div class="sect">
      <div class="sect-title">商品明细</div>
      ${itemsHtml}
      <div class="total">合计 ${money(o.total)}</div>
    </div>
    ${trackingHtml}`;
  return div;
}
function lookupMyOrders(){
  const key=document.getElementById('lookupKey').value.trim();
  if(!key){ alert('请输入收件人姓名或手机号'); return; }
  fetch('/api/orders/lookup?key='+encodeURIComponent(key))
    .then(r=>r.json())
    .then(list=>{
      const box=document.getElementById('myOrders'); box.innerHTML='';
      if(!list.length){ box.innerHTML='<div style="color:#999;font-size:13px;text-align:center">未找到相关订单</div>'; return; }
      list.forEach(o=> box.appendChild(buildOrderCard(o)) );
    }).catch(()=>alert('查询失败，请稍后重试'));
}
function copyBank(){
  const text = `${CONFIG.bankName || ''}\n户名：${CONFIG.bankHolder || ''}\n卡号：${CONFIG.bankAccount || ''}`;
  if(navigator.clipboard){ navigator.clipboard.writeText(text).then(()=>alert('银行卡信息已复制')); }
  else { window.prompt('长按复制以下内容：', text); }
}
function copyBankAccount(){
  const no = (CONFIG.bankAccount || '').replace(/\s+/g,'');
  if(!no){ alert('银行卡号未配置'); return; }
  copyText(no, '卡号已复制：'+no);
}

function sentScreenshot(){
  if(!O) return;
  if(!confirm('确认已将付款成功的页面截图发给夏天老师本人？')) return;
  fetch('/api/orders/'+O.id+'/paid',{method:'POST'})
    .then(r=>r.json())
    .then(()=>{ location.reload(); })
    .catch(()=>alert('提交失败，请直接私信夏天老师本人'));
}
function cancelOrder(id){
  if(!O) return;
  if(O.status!=='待付款'){ alert('只有待付款订单可以取消'); return; }
  if(!confirm('确定取消这笔订单？取消后不会发货，也无法恢复。')) return;
  fetch('/api/orders/'+id+'/cancel',{method:'POST'})
    .then(r=>r.json())
    .then(d=>{
      if(d.error){ alert('取消失败：'+(d.error==='only_pending_can_cancel'?'只有待付款订单可取消':d.error)); return; }
      try{ let arr=JSON.parse(localStorage.getItem('pendingOrders')||'[]'); arr=arr.filter(x=>x!==id); localStorage.setItem('pendingOrders',JSON.stringify(arr)); }catch(e){}
      alert('订单已取消'); location.href='/';
    }).catch(()=>alert('取消失败，请稍后重试'));
}
function openReminderModal(){
  if(!O) return;
  const w=600, pad=36, lineH=40, titleH=80;
  let h = pad*2 + titleH + lineH + lineH + lineH + O.items.length*lineH + lineH + lineH + lineH;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext('2d');
  // 背景
  ctx.fillStyle = '#fbf7f1';
  ctx.fillRect(0,0,w,h);
  // 边框
  ctx.strokeStyle = '#b8743f';
  ctx.lineWidth = 4;
  ctx.strokeRect(12,12,w-24,h-24);
  // 顶部标题
  ctx.fillStyle = '#b8743f';
  ctx.textAlign = 'center';
  ctx.font = 'bold 34px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('【催单】', w/2, pad+38);
  ctx.fillStyle = '#3a322b';
  ctx.font = '24px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('订单号：'+O.id, w/2, pad+titleH);
  // 左侧信息
  ctx.textAlign = 'left';
  let y = pad + titleH + lineH + 10;
  ctx.font = '24px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillStyle = '#3a322b';
  ctx.fillText('收件人：'+O.name, pad, y);
  y += lineH;
  ctx.fillStyle = '#9a8f82';
  ctx.font = '20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('商品明细：', pad, y);
  y += lineH;
  ctx.fillStyle = '#3a322b';
  ctx.font = '24px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  O.items.forEach(i => {
    ctx.fillText('• '+i.name+' ×'+i.qty, pad+16, y);
    y += lineH;
  });
  // 合计金额
  ctx.fillStyle = '#c0392b';
  ctx.font = 'bold 26px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText('合计：'+money(O.total), w-pad, y);
  ctx.textAlign = 'left';
  y += lineH;
  // 底部提示
  y += 10;
  ctx.fillStyle = '#c0392b';
  ctx.font = 'bold 26px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('我已付款，请抓紧审核后发货哦', pad, y);
  //  footer
  y += lineH;
  ctx.fillStyle = '#9a8f82';
  ctx.font = '20px -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif';
  ctx.fillText('长按保存图片，保存后直接发到群里', pad, y);

  const url = canvas.toDataURL('image/png');
  let modal = document.getElementById('reminderModal');
  if(!modal){
    modal = document.createElement('div');
    modal.id = 'reminderModal';
    modal.className = 'remodal';
    modal.innerHTML = '<div class="remodal-back" onclick="closeReminderModal()"></div><div class="remodal-box"><img id="reminderImg" alt="催单便签" style="touch-action:manipulation;-webkit-user-select:none;user-select:none"><div class="remodal-tip">长按上方图片保存，保存后直接发到群里<br>若无法长按保存，可点下方「保存图片」按钮</div><button class="remodal-close" onclick="saveReminderImage()" style="margin-right:8px">保存图片</button><button class="remodal-close" onclick="closeReminderModal()">关闭</button></div>';
    document.body.appendChild(modal);
  }
  document.getElementById('reminderImg').src = url;
  modal.style.display = 'flex';
}
function saveReminderImage(){
  const img = document.getElementById('reminderImg');
  if(!img || !img.src) return;
  if(isWechat()){ alert('微信内请长按上方图片保存到相册'); return; }
  const a = document.createElement('a');
  a.href = img.src;
  a.download = '催单_'+O.id+'.png';
  a.target = '_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
}
function closeReminderModal(){
  const modal = document.getElementById('reminderModal');
  if(modal) modal.style.display='none';
}

if(!O){
  app.innerHTML='<div class="gone">订单不存在<br>请检查订单号是否正确</div>';
} else {
  const statusMap={'待付款':['s-wait','① 待付款 · 请扫码支付'],'待确认':['s-confirm','② 已发截图 · 等待核对'],'待发货':['s-ship','③ 已确认收款 · 打包中'],'已发货':['s-done','④ 发货中 · 物流运输中'],'已取消':['s-cancel','订单已取消']};
  const [cls,label]=statusMap[O.status]||['s-wait',O.status];
  let html=`
    <div class="wrap">
      <div class="head" style="display:flex;justify-content:space-between;align-items:center">
        <div><h1>我的订单</h1><div class="id">订单号：${O.id}</div></div>
        <div style="display:flex;gap:8px;align-items:center">
          ${O.status==='待付款'?`<button onclick="cancelOrder('${O.id}')" style="color:#c0392b;font-size:12px;border:1px solid rgba(192,57,43,.6);background:rgba(255,255,255,.15);border-radius:16px;padding:7px 13px;cursor:pointer;white-space:nowrap">取消订单</button>`:''}
          <a href="/" style="color:#fff;font-size:12px;border:1px solid rgba(255,255,255,.55);border-radius:16px;padding:7px 13px;text-decoration:none;white-space:nowrap">← 返回商城继续购物</a>
        </div>
      </div>
      <div class="box">
        <div class="status ${cls}">${label}</div>
        <div class="row" style="margin-top:10px"><div class="k">收货人</div><div class="v">${O.name}</div></div>
        <div class="row"><div class="k">电话</div><div class="v">${O.phone}</div></div>
        <div class="row"><div class="k">地址</div><div class="v">${O.address}</div></div>
        ${O.wechat ? `<div class="row"><div class="k">微信号</div><div class="v">${O.wechat}</div></div>` : ''}
        <div class="row"><div class="k">下单时间</div><div class="v">${new Date(O.createdAt).toLocaleString('zh-CN')}</div></div>
      </div>
      <div class="box items">
        <div style="font-size:13px;color:#9a8f82;margin-bottom:6px">商品明细</div>`;
  O.items.forEach(i=>{
    html+=`<div class="it"><span>${i.name}</span><span class="q">${money(i.price)} × ${i.qty}</span></div>`;
    if(i.bundleItems && i.bundleItems.length){
      html+=`<div style="background:#fbf7f1;border-radius:8px;padding:9px 11px;margin:2px 0 10px;font-size:12px;color:#7a5230;line-height:1.75">
        <div style="font-weight:700;margin-bottom:3px">📦 发货内容</div>
        ${i.bundleItems.map(b=>`<div style="display:flex;justify-content:space-between"><span>• ${b.name}</span><span style="white-space:nowrap;margin-left:8px">${b.qty} ${b.unit||'件'}${i.qty>1?' ×'+i.qty:''}</span></div>`).join('')}
      </div>`;
    }
  });
  html+=`<div class="total">合计 ${money(O.total)}</div></div>`;

  // 进度条：三个节点，当前高亮
  const stepIdx = O.status==='待付款'?0:(O.status==='待确认'?1:(O.status==='待发货'?1:(O.status==='已取消'?0:2)));
  const steps=[
    {t:'① 提交订单',d:'核对商品与收货信息'},
    {t:'② 付款并截图',d:'支付后把成功页面截图发给夏天老师本人'},
    {t:'③ 发货中',d:'货物已在途中，请耐心等待'}
  ];
  html+=`<div class="box" style="padding:14px 12px">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px;color:#7a5230">订单进度</div>
    <div style="display:flex;justify-content:space-between;position:relative">
      ${steps.map((s,i)=>`<div style="flex:1;text-align:center;position:relative;z-index:1">
        <div style="width:28px;height:28px;line-height:28px;border-radius:50%;margin:0 auto;font-size:12px;font-weight:700;color:#fff;background:${i<=stepIdx?'#b8743f':'#ddd'}">${i+1}</div>
        <div style="font-size:12px;font-weight:700;margin-top:6px;color:${i<=stepIdx?'#3a322b':'#999'}">${s.t}</div>
        <div style="font-size:10px;color:#9a8f82;margin-top:2px;line-height:1.4;padding:0 2px">${s.d}</div>
      </div>`).join('')}
      <div style="position:absolute;top:14px;left:16.6%;right:16.6%;height:2px;background:linear-gradient(90deg,#b8743f ${stepIdx/2*100}%,#ddd ${stepIdx/2*100}%);z-index:0"></div>
    </div>
  </div>`;

  if(O.status==='待付款'){
    html+=`<div class="box pay">
      <div style="font-size:15px;font-weight:700;margin-bottom:12px">请选择支付方式（付款后请截图付款凭证）</div>
      <div class="pay-tabs" id="payTabs"></div>
      <div id="payBody"></div>
      <div class="tip">
        请选择上方任意方式完成支付，并把付款成功的页面截图发给夏天老师本人。夏天老师核对无误后，会点击确认收款，订单将自动进入待发货。
      </div>
      <div style="font-size:12px;color:#9a8f82;background:#fbf7f2;border-radius:10px;padding:10px 12px;margin-top:10px;line-height:1.7">
        💬 如有付款疑问，可联系夏天老师本人<br>
        微信：<b style="color:#b8743f">buchu2018</b> / <b style="color:#b8743f">buchu2021</b>
      </div>
      <button class="donebtn" onclick="sentScreenshot()">已付款，并将付款页面发给夏天老师本人完毕</button>
      <div style="font-size:12px;color:#9a8f82;text-align:center;margin-top:8px">点完可继续在本页查看订单进度，也可收藏本页</div>
    </div>`;
  } else if(O.status==='待确认'){
    html+=`<div class="box" style="text-align:center;padding:22px 18px">
      <div style="font-size:16px;font-weight:700;color:#7c3aed;margin-bottom:8px">等待审核后发货</div>
      <div style="font-size:13px;color:#7a6f62;line-height:1.7">夏天老师核对无误后将确认收款并安排发货。<br>您的订单号：<b style="color:#b8743f;font-size:16px">${O.id}</b></div>
      <div style="margin-top:14px;background:#fff7ef;border-radius:10px;padding:12px 14px;font-size:12px;color:#7a5230;line-height:1.7;text-align:left">
        💬 <b>如有疑问，请联系夏天老师微信：</b><br>
        <span style="font-weight:700;color:#b8743f">buchu2018</span> / <span style="font-weight:700;color:#b8743f">buchu2021</span>
      </div>
      <div style="margin-top:14px;background:#fbf7f1;border-radius:10px;padding:14px;text-align:left">
        <div style="font-size:12px;color:#9a8f82;margin-bottom:8px">继续逛逛</div>
        <div style="display:flex;gap:10px">
          <button onclick="location.href='/'" style="flex:1;border:none;background:#b8743f;color:#fff;border-radius:18px;padding:10px;font-size:13px;font-weight:600;cursor:pointer">返回首页继续选购</button>
          <button onclick="openReminderModal()" style="flex:1;border:none;background:#fff;color:#b8743f;border:1px solid #b8743f;border-radius:18px;padding:10px;font-size:13px;font-weight:600;cursor:pointer">📝 生成催单便签发回群里</button>
        </div>
      </div>
    </div>`;
  } else if(O.status==='待发货'){
    html+=`<div class="box"><div style="text-align:center;color:#2f6fd0;font-size:14px;line-height:1.7">夏天老师已确认收款，正在为您打包发货，请耐心等待 📦</div></div>`;
  } else if(O.status==='已发货'){
    const courier = O.tracking ? detectCourier(O.tracking) : {name:'快递单号'};
    html+=`<div class="box" style="text-align:center;padding:18px 16px">
      <div style="font-size:16px;font-weight:700;color:#1f9d55;margin-bottom:8px">发货中</div>
      <div style="font-size:13px;color:#7a6f62;line-height:1.7">可凭下方单号在对应快递公众号/小程序查询物流。</div>
      <div style="margin-top:14px;background:#f6f3ee;border-radius:10px;padding:12px">
        <div style="font-size:12px;color:#9a8f82">${courier.name}</div>
        <div style="font-size:18px;font-weight:700;color:#1f9d55;letter-spacing:1px;margin-top:4px;word-break:break-all">${O.tracking||'—'}</div>
        ${O.tracking ? `<div style="display:flex;gap:8px;justify-content:center;margin-top:10px">
          <button onclick="event.stopPropagation();copyText('${O.tracking}','单号已复制')" style="border:none;background:#fff;color:#1f9d55;border-radius:16px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer">复制单号</button>
          <button onclick="event.stopPropagation();queryTracking('${O.tracking}')" style="border:none;background:#1f9d55;color:#fff;border-radius:16px;padding:6px 14px;font-size:12px;font-weight:600;cursor:pointer">查物流</button>
        </div>` : ''}
      </div>
      <div style="font-size:12px;color:#9a8f82;margin-top:12px;line-height:1.6">有任何疑问可以联系商家本人<br>微信号：<b style="color:#b8743f">buchu2018</b> / <b style="color:#b8743f">buchu2021</b></div>
    </div>`;
  }
  } else if(O.status==='已取消'){
    html+=`<div class="box" style="border:1px solid #d4c8b8;background:#faf7f2">
      <div style="background:#d4c8b8;color:#5b3a1f;font-weight:700;font-size:15px;text-align:center;padding:12px;border-radius:8px">⚠️ 订单已取消</div>
      <div style="font-size:13px;color:#5b5147;line-height:1.9;margin-top:12px;text-align:left">
        商家反馈未收到您此笔订单金额，故此订单取消。<br>
        如有疑问，请联系夏天老师本人微信：<b style="color:#b8743f">buchu2018</b> / <b style="color:#b8743f">buchu2021</b>。<br>
        如补付款或核实后确有付款，本次订单将重新生成并发货。
      </div>
    </div>`;
  }
  app.innerHTML=html;

  if(O.status==='待付款') renderPayTabs();

  // 记录「待付款」订单，供下次打开商城时恢复；非待付款则清除记录
  try{
    const PENDING_KEY='pendingOrders';
    let arr=[]; try{ arr=JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ arr=[]; }
    if(O.status==='待付款'){ if(!arr.includes(O.id)){ arr.push(O.id); localStorage.setItem(PENDING_KEY,JSON.stringify(arr)); } }
    else { arr=arr.filter(x=>x!==O.id); localStorage.setItem(PENDING_KEY,JSON.stringify(arr)); }
  }catch(e){}
}

// 页面打开后自动拉取最新订单状态，防止商家后台已发货/已确认但客户端还是旧页面
function refreshOrder(){
  if(!O) return;
  fetch('/api/orders/'+O.id).then(r=>r.json()).then(o=>{
    if(!o || !o.id) return;
    if(o.status!==O.status || o.tracking!==O.tracking){
      O = o;
      location.reload();
    }
  }).catch(()=>{});
}
setTimeout(refreshOrder, 400);

function renderPayTabs(){
  // 始终展示三种支付方式选项卡，未配置时显示占位提示，让客户知道可选
  const tabs=[
    {id:'wechat',label:'微信收款码'},
    {id:'alipay',label:'支付宝收款码'},
    {id:'bank',label:'银行卡转账'}
  ];
  let cur = 'wechat';
  function build(){
    document.getElementById('payTabs').innerHTML = tabs.map(t=>`<button class="${t.id===cur?'on':''}" onclick="switchPay('${t.id}')">${t.label}</button>`).join('');
    let body='';
    if(cur==='wechat'){
      const src = CONFIG.paymentWechatQr || CONFIG.paymentQr;
      body = src ? `<div class="qr-wrap"><img src="${src}" alt="微信收款码" onclick="openQrLightbox('${src.replace(/'/g,"\\'")}','微信收款码')"></div><div style="font-size:13px;color:#7a5230;margin-top:10px">点击二维码放大，长按即可识别付款或保存</div>` : '<div class="placeholder">微信收款码未上传<br>请联系夏天老师获取</div>';
    } else if(cur==='alipay'){
      body = CONFIG.paymentAlipayQr ? `<div class="qr-wrap"><img src="${CONFIG.paymentAlipayQr}" alt="支付宝收款码" onclick="openQrLightbox('${CONFIG.paymentAlipayQr.replace(/'/g,"\\'")}','支付宝收款码')"></div><div style="font-size:13px;color:#7a5230;margin-top:10px">点击二维码放大，长按即可识别付款或保存</div>` : '<div class="placeholder">支付宝收款码未上传<br>请联系夏天老师获取</div>';
    } else if(cur==='bank'){
      if(CONFIG.bankAccount){
        body = `<div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap">
          <img class="bank-card-img" src="/assets/bank-card.jpg" alt="银行卡" onclick="openQrLightbox('/assets/bank-card.jpg','银行卡')">
          <div style="flex:1.5;min-width:180px;text-align:left">
            <div style="background:#faf7f2;border-radius:10px;padding:14px;margin-bottom:10px">
              <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
                <span style="font-size:12px;color:#9a8f82">收款银行卡号</span>
                <button onclick="copyBankAccount()" style="border:none;background:#b8743f;color:#fff;border-radius:14px;padding:5px 14px;font-size:12px;font-weight:600;cursor:pointer">复制</button>
              </div>
              <div style="font-size:18px;font-weight:700;color:#3a322b;letter-spacing:1px;word-break:break-all">${CONFIG.bankAccount||'—'}</div>
            </div>
            <div class="bank-info" style="margin:0">
              <div class="line"><span>收款人姓名</span><b>${CONFIG.bankHolder||'—'}</b></div>
              <div class="line"><span>收款银行</span><b>${CONFIG.bankName||'—'}</b></div>
            </div>
          </div>
        </div>
        <div class="bank-info" style="margin-top:10px">
          <button onclick="copyBank()">复制全部银行卡信息</button>
        </div>`;
      } else {
        body = '<div class="placeholder">银行卡信息未配置<br>请联系夏天老师获取</div>';
      }
    }
    document.getElementById('payBody').innerHTML = body;
  }
  window.switchPay = function(id){ cur=id; build(); };
  build();
}
</script>
