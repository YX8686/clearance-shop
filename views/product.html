<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>{{OG_TITLE}}</title>
<meta property="og:title" content="{{OG_TITLE}}">
<meta property="og:description" content="{{OG_DESC}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta property="og:url" content="{{OG_URL}}">
<link rel="icon" href="/assets/logo.ico">
<meta property="og:type" content="product">
<meta property="product:price:amount" content="{{OG_PRICE}}">
<meta property="product:price:currency" content="CNY">
<meta property="og:price:amount" content="{{OG_PRICE}}">
<meta property="og:price:currency" content="CNY">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{OG_TITLE}}">
<meta name="twitter:description" content="{{OG_DESC}}">
<meta name="twitter:image" content="{{OG_IMAGE}}">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f6f3ee;color:#3a322b;padding-bottom:80px}
  .nav{position:sticky;top:0;z-index:10;background:#fff;padding:12px 14px;font-size:14px;color:#7a6f62;border-bottom:1px solid #f0ece4}
  .nav a{color:#b8743f;text-decoration:none}
  .hero{width:100%;max-width:480px;aspect-ratio:1/1;object-fit:cover;background:#eee;display:block;margin:0 auto}
  /* 售罄遮罩：主图半透明黑 + 斜向右上方「已售罄」印章 */
  .herowrap{position:relative;width:100%;max-width:480px;margin:0 auto}
  .herowrap .hero{width:100%}
  .soldout-veil{position:absolute;inset:0;background:rgba(0,0,0,.5)}
  .soldout-stamp{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-18deg);color:#fff;font-size:26px;font-weight:800;letter-spacing:6px;border:3px solid rgba(255,255,255,.9);border-radius:8px;padding:6px 14px;background:rgba(0,0,0,.28);white-space:nowrap}
  .panel{background:#fff;padding:16px;border-bottom:1px solid #f0ece4;max-width:480px;margin:0 auto}
  .panel .name{font-size:20px;font-weight:700}
  .panel .price{color:#c0392b;font-weight:700;font-size:24px;margin-top:8px}
  .panel .price small{font-size:13px;font-weight:400}
  .panel .orig{color:#bbb;font-size:14px;text-decoration:line-through;margin-left:8px}
  .panel .stock{font-size:12px;color:#9a8f82;margin-top:6px}
  .desc{background:#fff;padding:16px;font-size:14px;line-height:1.8;color:#5b5147;max-width:480px;margin:0 auto}
  .desc h4{margin:0 0 8px;font-size:14px;color:#7a5230}
  .desc .body{white-space:pre-wrap;word-break:break-word}
  .detail-images{background:#fff;padding:16px;max-width:480px;margin:0 auto;border-bottom:1px solid #f0ece4}
  .detail-images h4{margin:0 0 12px;font-size:14px;color:#7a5230}
  .detail-images img{width:100%;border-radius:10px;margin-bottom:12px;display:block;background:#eee}
  .bundle{background:#fff;padding:16px;max-width:480px;margin:0 auto;border-bottom:1px solid #f0ece4}
  .bundle h4{margin:0 0 12px;font-size:14px;color:#7a5230}
  .bundle .item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f5f1ea;font-size:14px;color:#5b5147}
  .bundle .item:last-child{border-bottom:none}
  .bundle .dot{width:6px;height:6px;border-radius:50%;background:#c0392b}
  .bundle .name{flex:1}
  .bundle .qty{font-weight:700;color:#3a322b}
  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;display:flex;gap:10px;padding:12px 14px;box-shadow:0 -2px 10px rgba(0,0,0,.06)}
  .bar .home{background:#f3ece2;color:#7a5230;border:none;border-radius:24px;padding:0 16px;font-size:13px;cursor:pointer}
  .bar .buy{flex:1;background:#b8743f;color:#fff;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  .bar .buy:disabled{background:#d8ccba;color:#fff;cursor:not-allowed}
  .bar .buy span.from{font-size:13px;font-weight:400;margin-right:3px}
  /* SKU 选择弹窗 */
  .sku-modal{position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center}
  .sku-modal.show{display:flex}
  .sku-sheet{width:100%;max-width:480px;background:#fff;border-radius:18px 18px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto;box-shadow:0 -4px 20px rgba(0,0,0,.15);position:relative}
  .sku-sheet .close{position:absolute;top:12px;right:12px;width:30px;height:30px;border:none;background:#f4f1ec;border-radius:50%;font-size:20px;color:#7a6f62;cursor:pointer;z-index:2}
  .sku-head{display:flex;gap:12px;margin-bottom:18px;align-items:flex-start;padding-right:36px}
  .sku-head img{width:86px;height:86px;border-radius:10px;object-fit:cover;background:#eee;border:1px solid #f0ece4}
  .sku-head .info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;min-height:86px}
  .sku-head .price{color:#c0392b;font-weight:700;font-size:22px;line-height:1}
  .sku-head .price .from{font-size:13px;font-weight:400;margin-left:2px}
  .sku-head .picked{font-size:13px;color:#7a6f62;margin-top:8px}
  .sku-head .stock{font-size:12px;color:#9a8f82;margin-top:4px}
  .sku-section{margin-bottom:18px}
  .sku-sec-title{font-size:13px;color:#3a322b;font-weight:600;margin-bottom:10px}
  .sku-opts{display:flex;flex-wrap:wrap;gap:10px}
  .sku-opt{border:1px solid #e0d6c8;background:#fff;border-radius:20px;padding:9px 16px;font-size:13px;color:#3a322b;cursor:pointer;transition:all .15s}
  .sku-opt.on{border-color:#b8743f;background:#fff7ef;color:#b8743f;font-weight:600}
  .sku-opt.off{border-color:#eee;background:#faf8f4;color:#c8c0b4;cursor:not-allowed}
  .sku-opt.off .sub{color:#c0392b}
  .sku-opt .sub{font-size:11px;color:#9a8f82;margin-left:4px}
  .sku-qty-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
  .qty-box{display:flex;align-items:center;border:1px solid #e0d6c8;border-radius:8px;overflow:hidden}
  .qty-box button{width:34px;height:34px;border:none;background:#faf7f2;font-size:18px;color:#5b5147;cursor:pointer}
  .qty-box input{width:48px;height:34px;text-align:center;border:none;border-left:1px solid #e0d6c8;border-right:1px solid #e0d6c8;font-size:15px;color:#3a322b}
  .stock-hint{font-size:12px;color:#9a8f82}
  .sku-bundle{background:#faf7f2;border-radius:10px;padding:12px;margin-bottom:18px;font-size:13px;color:#5b5147;line-height:1.7}
  .sku-bundle .sku-sec-title{margin-bottom:8px}
  .sku-bundle .li{display:flex;justify-content:space-between;padding:3px 0}
  .sku-foot{display:flex;gap:10px}
  .sku-foot button{flex:1;border:none;border-radius:24px;padding:14px;font-size:15px;font-weight:700;cursor:pointer}
  .sku-foot button:disabled{background:#d8ccba;color:#fff;cursor:not-allowed}
  .sku-foot .buy-now{background:#f3c96a;color:#5b3d1b}
  .sku-foot .add-cart{background:#c0392b;color:#fff}
  /* 购物车右侧抽屉 */
  .fab{position:fixed;right:16px;bottom:90px;z-index:30;background:#b8743f;color:#fff;width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:0 4px 14px rgba(184,116,63,.5);cursor:pointer}
  .badge{position:absolute;top:-2px;right:-2px;background:#c0392b;color:#fff;font-size:11px;min-width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;display:none}
  .mask.show{display:block}
  .drawer{position:fixed;top:0;right:0;bottom:0;left:auto;width:100%;max-width:420px;z-index:50;background:#fff;border-radius:18px 0 0 18px;box-shadow:-4px 0 20px rgba(0,0,0,.1);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .25s}
  .drawer.show{transform:translateX(0)}
  .drawer h3{margin:0;padding:16px;font-size:15px;border-bottom:1px solid #f0ece4;display:flex;justify-content:space-between;align-items:center}
  .drawer h3 .cls{font-size:22px;color:#bbb;cursor:pointer}
  .items{overflow:auto;padding:6px 16px;flex:1}
  .item{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #f5f1ea}
  .item img{width:48px;height:48px;border-radius:8px;object-fit:cover;background:#eee}
  .item .info{flex:1;min-width:0}
  .item .info .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .info .p{font-size:12px;color:#c0392b;margin-top:3px}
  .stepper{display:flex;align-items:center;gap:8px}
  .stepper button{width:26px;height:26px;border-radius:50%;border:1px solid #d8ccba;background:#fff;font-size:16px;cursor:pointer}
  .stepper span{min-width:18px;text-align:center;font-size:14px}
  .empty{padding:40px 0;text-align:center;color:#bbb;font-size:13px}
  .foot{padding:14px 16px;box-shadow:0 -2px 10px rgba(0,0,0,.05)}
  .foot .tot{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
  .foot .tot b{font-size:18px;color:#c0392b}
  .foot .btns{display:flex;gap:10px}
  .foot .back{flex:1;background:#f3ece2;color:#7a5230;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  .foot .chk{flex:1;width:auto;background:#b8743f;color:#fff;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:700;cursor:pointer}
  .foot .chk:disabled{background:#d8ccba}
  /* 结算表单（中间竖版弹窗） */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px}
  .modal.show{display:flex}
  .sheet{background:#fff;width:100%;max-width:420px;border-radius:18px;padding:18px 16px 22px;max-height:86vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.2)}
  .sheet h3{margin:0 0 14px;font-size:16px}
  .field{margin-bottom:12px}
  .field label{font-size:12px;color:#7a6f62;display:block;margin-bottom:5px}
  .field input,.field textarea{width:100%;border:1px solid #e0d6c8;border-radius:9px;padding:11px;font-size:14px;font-family:inherit}
  .field textarea{resize:vertical;min-height:54px}
  .sheet .submit{width:100%;background:#b8743f;color:#fff;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:700;margin-top:6px;cursor:pointer}
  .sheet .hint{font-size:12px;color:#9a8f82;line-height:1.6;background:#fbf7f1;padding:10px;border-radius:9px;margin-top:10px}
</style>
</head>
<body>
  <div class="nav"><a href="/">← 返回商城</a></div>
  <div class="herowrap">
    <img class="hero" id="hero" src="" loading="eager" decoding="async">
    <div class="soldout-veil" id="soldVeil" style="display:none"></div>
    <div class="soldout-stamp" id="soldStamp" style="display:none">已售罄</div>
  </div>
  <div class="panel">
    <div class="name" id="pName"></div>
    <div class="price" id="pPrice"></div>
    <div class="stock" id="pStock"></div>
  </div>
  <div class="desc"><h4>商品说明</h4><div class="body" id="pDesc"></div></div>
  <div class="bundle" id="bundleBox" style="display:none">
    <h4>该活动链接实际包含：</h4>
    <div id="bundleList"></div>
  </div>
  <div class="detail-images" id="detailBox" style="display:none">
    <h4>详情展示</h4>
    <div id="detailList"></div>
  </div>

  <div class="bar">
    <button class="home" onclick="location.href='/'">🏠 商城</button>
    <button class="buy" id="buyBtn" onclick="buy()">加入购物车</button>
  </div>

  <!-- SKU 选择弹窗 -->
  <div class="sku-modal" id="skuModal" onclick="if(event.target===this)closeSkuModal()">
    <div class="sku-sheet">
      <button class="close" onclick="closeSkuModal()">×</button>
      <div class="sku-head">
        <img id="skuImg" src="" alt="">
        <div class="info">
          <div class="price" id="skuPrice">¥0</div>
          <div class="picked" id="skuPicked">请选择型号</div>
          <div class="stock" id="skuStock">库存：0 件</div>
        </div>
      </div>
      <div class="sku-section">
        <div class="sku-sec-title">规格</div>
        <div class="sku-opts" id="skuOpts"></div>
      </div>
      <div class="sku-qty-row">
        <span class="sku-sec-title" style="margin:0">数量</span>
        <div style="display:flex;align-items:center;gap:10px">
          <div class="qty-box">
            <button onclick="changeSkuQty(-1)">−</button>
            <input type="number" id="skuQty" value="1" min="1" onchange="syncSkuQty(this.value)">
            <button onclick="changeSkuQty(1)">+</button>
          </div>
          <span class="stock-hint" id="skuStockHint">库存 0 件</span>
        </div>
      </div>
      <div class="sku-bundle" id="skuBundleBox" style="display:none">
        <div class="sku-sec-title">该选项实际包含</div>
        <div id="skuBundleList"></div>
      </div>
      <div class="sku-foot">
        <button class="buy-now" id="skuBuyBtn" onclick="skuBuyNow()">立即购买</button>
        <button class="add-cart" id="skuAddBtn" onclick="skuAddToCart()">加入购物车</button>
      </div>
    </div>
  </div>

  <!-- 购物车 -->
  <div class="fab" onclick="openCart()">🛒<span class="badge" id="badge" style="display:none">0</span></div>
  <div class="mask" id="mask" onclick="closeCart()"></div>
  <div class="drawer" id="drawer">
    <h3>购物车 <span class="cls" onclick="closeCart()">×</span></h3>
    <div class="items" id="cartItems"></div>
    <div class="foot">
      <div class="tot"><span>合计</span><b id="cartTotal">¥0</b></div>
      <div class="btns">
        <button class="back" onclick="closeCart()">返回继续加购</button>
        <button class="chk" id="chkBtn" disabled onclick="openCheckout()">去结算</button>
      </div>
    </div>
  </div>

  <!-- 结算 -->
  <div class="modal" id="checkout" onclick="if(event.target===this)closeCheckout()">
    <div class="sheet">
      <h3>填写收货信息</h3>
      <div class="field"><label>姓名</label><input id="cName" placeholder="收货人姓名"></div>
      <div class="field"><label>电话</label><input id="cPhone" placeholder="手机号" inputmode="numeric"></div>
      <div class="field"><label>地址</label><textarea id="cAddr" placeholder="详细收货地址"></textarea></div>
      <div class="field">
        <label>微信号</label>
        <input id="cWechat" placeholder="微信号">
        <div style="font-size:12px;color:#9a8f82;margin-top:6px;line-height:1.5">💡 <span style="color:#7a5230;font-weight:600">微信号在哪里看到？</span><br>打开你的微信，点右下角的“我”，页面上方的头像右边就会显示“微信号：XXX”。</div>
      </div>
      <button class="submit" onclick="submitOrder()">提交订单</button>
      <div class="hint">提交后跳转订单页，按页面提示扫码支付，<b>支付后，请将付款成功的微信或支付宝页面截图私信给夏天老师本人，以做核实和登记</b>。本店免登录，请收藏订单页以便查看物流。</div>
    </div>
  </div>

  <!-- 待付款订单恢复弹窗 -->
  <div class="modal" id="pendingModal" onclick="if(event.target===this)closePending()">
    <div class="sheet" style="text-align:center">
      <h3>💰 您有一笔订单待付款</h3>
      <div id="pendingList" style="font-size:13px;color:#7a6f62;line-height:1.8;margin-bottom:14px"></div>
      <button class="submit" id="pendingPayBtn" onclick="goPendingPay()">继续付款</button>
      <button style="width:100%;background:#f3ece2;color:#7a5230;border:none;border-radius:24px;padding:13px;font-size:15px;font-weight:700;margin-top:10px;cursor:pointer" onclick="markPaidAndGo()">已付款，且已截图付款成功页面发给夏天完毕</button>
      <div style="font-size:11px;color:#bbb;margin-top:12px;line-height:1.6">点击上方按钮后可直接查看订单进度<br>信息只保存在本机，请勿清理微信缓存</div>
    </div>
  </div>

<script>
const P = {{PRODUCT_JSON}};
const PRODUCTS = {{PRODUCTS_JSON}};
const CONFIG = {{CONFIG_JSON}};
let cart = {};
try { cart = JSON.parse(localStorage.getItem('cart')||'{}'); } catch(e){ cart={}; }

const $ = s=>document.querySelector(s);
function money(n){ return '¥'+Number(n).toLocaleString('zh-CN'); }

function set(){
  document.title = P.name;
  document.querySelector('meta[property="og:title"]').setAttribute('content', P.name);
  document.getElementById('hero').src = P.image||'/assets/product-placeholder.svg';
  document.getElementById('pName').textContent = P.name;
  const hasSkus = Array.isArray(P.skus) && P.skus.length>0;
  const minPrice = hasSkus ? Math.min(...P.skus.map(s=>Number(s.price||P.price||0))) : (P.price||0);
  const priceLabel = money(minPrice);
  const unitLabel = hasSkus ? '<small>/起</small>' : '';
  document.getElementById('pPrice').innerHTML = priceLabel+unitLabel + ((P.originalPrice&&P.originalPrice>minPrice)?'<span class="orig">'+money(P.originalPrice)+'</span>':'');
  // 库存行：售罄红字提示，有货显示剩余件数
  const pSt = (P.stock!=null && P.stock!=='') ? Number(P.stock) : null;
  document.getElementById('pStock').innerHTML = isSoldOut(P)
    ? '<span style="color:#c0392b;font-weight:700">已售罄 · 可联系夏天老师询问补货</span>'
    : (pSt!=null ? ('库存：'+pSt+' 件'+(pSt<=5?'<span style="color:#c0392b">（仅剩少量，欲购从速）</span>':'')) : '');
  document.getElementById('pDesc').innerHTML = P.desc||'';

  // 有 SKU 时，“该活动链接实际包含”不再固定展示，改为在 SKU 弹窗里随选随显
  const bundles = Array.isArray(P.bundleItems) ? P.bundleItems.filter(b=>b.name && b.qty>0) : [];
  if(bundles.length && !hasSkus){
    const box=document.getElementById('bundleBox'); box.style.display='block';
    document.getElementById('bundleList').innerHTML = bundles.map(b=>`
      <div class="item"><span class="dot"></span><span class="name">${b.name}</span><span class="qty">${b.qty} ${b.unit||'件'}</span></div>
    `).join('');
  }

  // 详情页图（支持本地路径 /xxx 与完整 http(s):// 外链）
  const details = Array.isArray(P.detailImages) ? P.detailImages.filter(u=>String(u).trim()!=='') : [];
  if(details.length){
    const box=document.getElementById('detailBox'); box.style.display='block';
    document.getElementById('detailList').innerHTML = details.map(u=>`<img src="${u}" alt="详情图" loading="lazy" decoding="async">`).join('');
  }

  // 底部按钮文案 + 售罄禁用
  const buyBtn = document.getElementById('buyBtn');
  if(isSoldOut(P)){
    buyBtn.disabled = true;
    buyBtn.innerHTML = '已售罄';
    document.getElementById('soldVeil').style.display='block';
    document.getElementById('soldStamp').style.display='block';
  } else {
    buyBtn.disabled = false;
    buyBtn.innerHTML = hasSkus ? '选择规格 <span class="from">加入购物车</span>' : '加入购物车';
  }
}

function cartCount(){ return Object.values(cart).reduce((a,b)=>a+b,0); }
function cartTotal(){ return Object.entries(cart).reduce((s,[id,q])=>{ const info=getCartInfo(id); return s+(info.price*q); },0); }
function saveCart(){ localStorage.setItem('cart',JSON.stringify(cart)); updateBadge(); }
function updateBadge(){ const n=cartCount(); const b=$('#badge'); if(n>0){b.style.display='flex';b.textContent=n;} else b.style.display='none'; }

// SKU 选择弹窗状态
let curSkuId='';
let curSkuQty=1;
function hasSkus(p){ return Array.isArray(p.skus) && p.skus.length>0; }
// ===== 库存 / 售罄判断 =====
function skuStockOf(p, s){
  if(s && s.stock!=null && s.stock!=='') return Number(s.stock);
  if(p && p.stock!=null && p.stock!=='') return Number(p.stock);
  return null;
}
function isSoldOut(p){
  if(p.forceSoldOut) return true;
  if(hasSkus(p)){
    return p.skus.every(s=>{ const st=skuStockOf(p,s); return st!=null && st<=0; });
  }
  const st = (p.stock!=null && p.stock!=='') ? Number(p.stock) : null;
  return st!=null && st<=0;
}
function getCartKey(p, skuId){ return skuId ? (p.id+'#'+skuId) : p.id; }
function getCartInfo(key){
  const [pid, skuId] = key.split('#');
  const p = PRODUCTS.find(x=>x.id===pid) || {name:'已下架商品'};
  if(!skuId) return {p, skuId:'', name:p.name, price:p?p.price:0, image:p?p.image||p.images&&p.images[0]:''};
  const sku = (p.skus||[]).find(s=>String(s.id)===skuId);
  if(!sku) return {p, skuId, name:p.name, price:p?p.price:0, image:p?p.image||p.images&&p.images[0]:''};
  return {p, skuId, name: p.name+' · '+sku.name, price: Number(sku.price||p.price||0), image: sku.image||p.image||''};
}

function openSkuModal(p, quickBuy){
  const skus = p.skus || [];
  if(!skus.length){
    // 无 SKU 产品：售罄直接拦截
    if(isSoldOut(p)){ alert('该商品已售罄，看看其他宝贝吧～'); return; }
    cart[getCartKey(p,'')]=(cart[getCartKey(p,'')]||0)+1; saveCart();
    if(quickBuy) openCheckout();
    else openCart();
    return;
  }
  // 默认选中第一个有货的规格；全部售罄则停在第一个（按钮置灰）
  const firstOk = skus.find(s=>{ const st=skuStockOf(p,s); return st==null || st>0; });
  curSkuId = (firstOk || skus[0]).id;
  curSkuQty = 1;
  document.getElementById('skuImg').src = p.image||'/assets/product-placeholder.svg';
  document.getElementById('skuPicked').textContent = '请选择型号';
  const minPrice = Math.min(...skus.map(s=>Number(s.price||p.price||0)));
  document.getElementById('skuPrice').innerHTML = money(minPrice)+'<small>/起</small>';
  document.getElementById('skuStock').textContent = '库存：' + (p.stock!=null?p.stock:'—') + ' 件';
  document.getElementById('skuStockHint').textContent = '库存 ' + (p.stock!=null?p.stock:'—') + ' 件';
  renderSkuOptions(p);
  selectSku(p, curSkuId);
  document.getElementById('skuModal').classList.add('show');
}
function closeSkuModal(){ document.getElementById('skuModal').classList.remove('show'); }
function renderSkuOptions(p){
  const box = document.getElementById('skuOpts');
  box.innerHTML = p.skus.map(s=>{
    const st = skuStockOf(p, s);
    const off = st!=null && st<=0; // 该规格售罄，不可选
    return `<div class="sku-opt ${s.id===curSkuId?'on':''} ${off?'off':''}" ${off?'':`onclick="selectSku(P,'${s.id}')"`}>
      <span>${s.name}</span>${off?'<span class="sub">已售罄</span>':(st!=null?`<span class="sub">余${st}</span>`:'')}
    </div>`;
  }).join('');
}
function selectSku(p, skuId){
  curSkuId = skuId; curSkuQty = Math.max(1, curSkuQty);
  renderSkuOptions(p);
  const sku = p.skus.find(s=>String(s.id)===skuId) || {};
  document.getElementById('skuPrice').textContent = money(sku.price||p.price||0);
  document.getElementById('skuPicked').textContent = sku.name ? ('已选：'+sku.name) : '请选择型号';
  const st = skuStockOf(p, sku);
  const stockText = st==null ? '库存充足' : (st<=0 ? '已售罄' : '仅剩 '+st+' 件');
  document.getElementById('skuStock').textContent = stockText;
  document.getElementById('skuStockHint').textContent = stockText;
  // 售罄规格：立即购买 / 加入购物车 双按钮禁用
  const soldOut = st!=null && st<=0;
  document.getElementById('skuBuyBtn').disabled = soldOut;
  document.getElementById('skuAddBtn').disabled = soldOut;
  // 数量不超库存
  if(st!=null && curSkuQty>st) curSkuQty = Math.max(1, st);
  // 显示该 SKU 发货内容；没有配置则隐藏，避免回退到产品级导致错配
  const bundles = sku.bundleItems || [];
  const bb = document.getElementById('skuBundleBox');
  if(bundles.length){
    bb.style.display='block';
    document.getElementById('skuBundleList').innerHTML = bundles.map(b=>`
      <div class="li"><span>• ${b.name}</span><span>${b.qty} ${b.unit||'件'}</span></div>
    `).join('');
  } else { bb.style.display='none'; }
  document.getElementById('skuQty').value = curSkuQty;
}
function changeSkuQty(d){
  const sku=(P.skus||[]).find(s=>String(s.id)===curSkuId)||{};
  const st=skuStockOf(P, sku);
  let next = curSkuQty + d;
  if(st!=null && next>st) next = Math.max(1, st);
  curSkuQty = Math.max(1, next); document.getElementById('skuQty').value=curSkuQty;
}
function syncSkuQty(v){
  const sku=(P.skus||[]).find(s=>String(s.id)===curSkuId)||{};
  const st=skuStockOf(P, sku);
  let q = Math.max(1, Math.floor(Number(v)||1));
  if(st!=null && q>st) q = Math.max(1, st);
  curSkuQty = q; document.getElementById('skuQty').value=curSkuQty;
}
function skuAddToCart(){
  if(!curSkuId) return;
  const sku=(P.skus||[]).find(s=>String(s.id)===curSkuId)||{};
  const st=skuStockOf(P, sku);
  if(st!=null && st<=0){ alert('该规格已售罄，请选择其他规格'); return; }
  const key = getCartKey(P, curSkuId);
  cart[key] = (cart[key]||0) + curSkuQty;
  saveCart(); closeSkuModal(); openCart();
}
function skuBuyNow(){
  if(!curSkuId) return;
  const sku=(P.skus||[]).find(s=>String(s.id)===curSkuId)||{};
  const st=skuStockOf(P, sku);
  if(st!=null && st<=0){ alert('该规格已售罄，请选择其他规格'); return; }
  const key = getCartKey(P, curSkuId);
  cart[key] = (cart[key]||0) + curSkuQty;
  saveCart(); closeSkuModal(); openCheckout();
}

function buy(){ openSkuModal(P, false); }
function changeQty(id,d){ cart[id]=(cart[id]||0)+d; if(cart[id]<=0) delete cart[id]; saveCart(); renderCart(); }

function openCart(){ $('#mask').classList.add('show'); $('#drawer').classList.add('show'); renderCart(); }
function closeCart(){ $('#mask').classList.remove('show'); $('#drawer').classList.remove('show'); }

function renderCart(){
  const box=$('#cartItems'); box.innerHTML='';
  const ids=Object.keys(cart);
  if(!ids.length){ box.innerHTML='<div class="empty">购物车还是空的</div>'; $('#chkBtn').disabled=true; }
  else {
    ids.forEach(id=>{
      const info=getCartInfo(id); if(!info.p || info.name==='已下架商品') return;
      const row=document.createElement('div'); row.className='item';
      row.innerHTML=`
        <img src="${info.image||'/assets/product-placeholder.svg'}" loading="lazy" decoding="async">
        <div class="info"><div class="n">${info.name}</div><div class="p">${money(info.price)}</div></div>
        <div class="stepper"><button onclick="changeQty('${id}',-1)">−</button><span>${cart[id]}</span><button onclick="changeQty('${id}',1)">+</button></div>`;
      box.appendChild(row);
    });
    $('#chkBtn').disabled=false;
  }
  $('#cartTotal').textContent=money(cartTotal());
}

function openCheckout(){ if(!cartCount()) return; closeCart(); fillBuyer(); $('#checkout').classList.add('show'); }
function closeCheckout(){ $('#checkout').classList.remove('show'); }

// ===== 收货信息自动记忆 =====
const BUYER_KEY='buyerInfo';
function saveBuyer(){
  try{ localStorage.setItem(BUYER_KEY, JSON.stringify({
    name:$('#cName').value.trim(), phone:$('#cPhone').value.trim(), addr:$('#cAddr').value.trim(), wechat:$('#cWechat').value.trim()
  })); }catch(e){}
}
function fillBuyer(){
  try{
    const b=JSON.parse(localStorage.getItem(BUYER_KEY)||'null');
    if(!b) return;
    if(b.name) $('#cName').value=b.name;
    if(b.phone) $('#cPhone').value=b.phone;
    if(b.addr) $('#cAddr').value=b.addr;
    if(b.wechat) $('#cWechat').value=b.wechat;
  }catch(e){}
}

// ===== 待付款订单恢复 =====
const PENDING_KEY='pendingOrders';
function getPending(){ try{ return JSON.parse(localStorage.getItem(PENDING_KEY)||'[]'); }catch(e){ return []; } }
function setPending(arr){ try{ localStorage.setItem(PENDING_KEY, JSON.stringify(arr)); }catch(e){} }
function addPending(id){ const arr=getPending(); if(!arr.includes(id)){ arr.push(id); setPending(arr); } }
function removePending(id){ setPending(getPending().filter(x=>x!==id)); }
let pendingOrders=[];
function checkPendingOrders(){
  const ids=getPending();
  if(!ids.length) return;
  let done=0;
  ids.forEach(id=>{
    fetch('/api/orders/'+id).then(r=>r.json()).then(o=>{
      if(o && o.id && o.status==='待付款') pendingOrders.push(o);
      else removePending(id);
    }).catch(()=>{}).finally(()=>{
      done++;
      if(done===ids.length && pendingOrders.length) showPendingModal();
    });
  });
}
function showPendingModal(){
  const list=document.getElementById('pendingList');
  list.innerHTML = pendingOrders.map((o,i)=>{
    const itemLines = o.items.map(it=>{
      const img = it.image || (PRODUCTS.find(p=>p.id===it.id)||{}).image || '/assets/logo.png';
      return `<div style="display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #f0ece4">
        <img src="${img}" style="width:40px;height:40px;border-radius:6px;object-fit:cover;background:#eee" onerror="this.src='/assets/logo.png'">
        <div style="flex:1;min-width:0;font-size:13px">
          <div style="font-weight:600;color:#3a322b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${it.name}</div>
          <div style="font-size:12px;color:#9a8f82">${money(it.price)} × ${it.qty}</div>
        </div>
        <div style="font-size:13px;font-weight:700;color:#c0392b;white-space:nowrap">${money(it.price*it.qty)}</div>
      </div>`;
    }).join('');
    return `<div style="background:#fbf7f1;border-radius:10px;padding:10px 12px;margin-bottom:8px;text-align:left">
      <div style="font-weight:700;color:#b8743f;letter-spacing:.5px">订单号：${o.id}</div>
      <div style="margin-top:6px">${itemLines}</div>
      <div style="display:flex;justify-content:space-between;margin-top:8px;padding-top:6px;border-top:1px solid #f0ece4;font-size:13px;color:#7a6f62">
        <span>共 ${o.items.reduce((a,b)=>a+b.qty,0)} 件</span><span style="color:#c0392b;font-weight:700">合计 ${money(o.total)}</span>
      </div>
    </div>`;
  }).join('');
  document.getElementById('pendingModal').classList.add('show');
}
function closePending(){ document.getElementById('pendingModal').classList.remove('show'); }
function goPendingPay(){ const o=pendingOrders[0]; if(o) location.href='/order/'+o.id; }
function markPaidAndGo(){
  const o=pendingOrders[0]; if(!o) return;
  fetch('/api/orders/'+o.id+'/paid',{method:'POST'})
    .then(r=>r.json()).then(d=>{
      removePending(o.id);
      location.href='/order/'+o.id+'?from=paid';
    }).catch(()=>{
      removePending(o.id);
      location.href='/order/'+o.id+'?from=paid';
    });
}

function submitOrder(){
  const name=$('#cName').value.trim(), phone=$('#cPhone').value.trim(), addr=$('#cAddr').value.trim(), wechat=$('#cWechat').value.trim();
  if(!name||!phone||!addr){ alert('请填写完整收货信息'); return; }
  const items=Object.entries(cart).map(([id,q])=>{
    const [pid, skuId] = id.split('#');
    return {id:pid, skuId:skuId||undefined, qty:q};
  });
  if(!items.length){ alert('购物车为空'); return; }
  fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,phone,address:addr,wechat,items})})
    .then(r=>r.json()).then(d=>{
      if(d.id){ saveBuyer(); addPending(d.id); cart={}; saveCart(); closeCheckout(); location.href='/order/'+d.id; }
      else {
        const msg = d.message || d.error || '未知错误';
        alert('下单失败：'+msg+'\n\n如提示"数据目录不可写"或"operation not permitted"，请关闭当前黑窗口，双击桌面图标「不初限时狂欢商城」重新启动服务。');
      }
    }).catch(e=>alert('网络错误：'+e.message+'\n\n请检查是否已双击桌面图标启动商城服务。'));
}

set(); updateBadge(); checkPendingOrders();
</script>
</body>
